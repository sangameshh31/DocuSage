spring.application.name=docusage
# Hosting platforms (Render, Railway, Fly.io) inject their own PORT.
server.port=${PORT:8080}

# --- Storage: embedded H2 so the app runs with zero setup.
# Swap these four lines for PostgreSQL in a real deployment (see README).
spring.datasource.url=jdbc:h2:mem:docusage;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# --- DocuSage settings
# Chunking / retrieval
docusage.chunk-size=900
docusage.chunk-overlap=120
docusage.top-k=4

# Providers. Defaults are fully local and need no API key:
#   embeddings: hashing (feature hashing) | gemini (needs GEMINI_API_KEY)
#   chat:       extractive (returns passages) | gemini (needs GEMINI_API_KEY)
docusage.embedding.provider=hashing
docusage.embedding.dimension=384
docusage.chat.provider=extractive

# Gemini (only used when a provider above is set to gemini)
docusage.gemini.api-key=${GEMINI_API_KEY:}
docusage.gemini.embedding-model=text-embedding-004
docusage.gemini.chat-model=gemini-2.0-flash
